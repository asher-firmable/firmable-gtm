name: Daily Mailbox Rotation Check

on:
  schedule:
    - cron: '0 23 * * *'  # 9am AEST (UTC+10) = 11pm UTC
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

jobs:
  rotation-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip3 install requests python-dotenv supabase pandas openpyxl

      - name: Run rotation check
        run: PYTHONPATH=. python3 projects/mailbox-rotation/scripts/rotation_check.py
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_MAILBOX_WEBHOOK_URL: ${{ secrets.SLACK_MAILBOX_WEBHOOK_URL }}

      - name: Alert Slack on failure
        if: failure()
        env:
          SLACK_MAILBOX_WEBHOOK_URL: ${{ secrets.SLACK_MAILBOX_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$SLACK_MAILBOX_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":rotating_light: Daily mailbox rotation check FAILED. Logs: ${RUN_URL}\"}" \
            "$SLACK_MAILBOX_WEBHOOK_URL"
